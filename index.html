<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Animals — 9U Lineup Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E2B1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PA Lineup">
<style>
  :root{
    --cream:#F6F1E4;
    --card:#FFFDF7;
    --ink:#1E2B1E;
    --ink-soft:#4A5A46;
    --grass-dark:#4C7A3D;
    --grass-light:#5B8C46;
    --dirt:#C69766;
    --dirt-dark:#B4854F;
    --chalk:#FBF8F1;
    --coral:#E4573D;
    --coral-dark:#C8432B;
    --gold:#E8AC3E;
    --line:#DCD3BE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:20px 14px 60px;
  }
  .wrap{max-width:620px;margin:0 auto;}
  header{margin-bottom:14px;}
  .eyebrow{font-size:13px;color:var(--ink-soft);margin:0 0 2px;}
  h1{
    font-family:'Teko',sans-serif;
    font-weight:600;
    font-size:44px;
    letter-spacing:0.5px;
    line-height:0.95;
    margin:0;
    color:var(--ink);
  }
  .subtitle{font-size:14px;color:var(--ink-soft);margin:4px 0 0;}
  .innings{display:flex;gap:6px;margin:18px 0 10px;flex-wrap:wrap;}
  .inning-btn{
    flex:1;min-width:40px;padding:9px 0;text-align:center;border-radius:8px;
    border:1px solid var(--line);background:var(--card);
    font-family:'Teko',sans-serif;font-size:20px;font-weight:600;color:var(--ink);
    cursor:pointer;transition:background .15s, color .15s, border-color .15s;
  }
  .inning-btn.active{background:var(--coral);border-color:var(--coral);color:var(--chalk);}
  .toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:9px 13px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn.danger{color:var(--coral-dark);}
  .btn.primary{background:var(--ink);color:var(--chalk);border-color:var(--ink);}
  .field-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:18px;
  }
  .field-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 700 / 660;
    border-radius:10px;
    overflow:hidden;
  }
  .field-wrap svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .field-pos{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .pos-label{
    font-family:'Teko',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--chalk);
    background:rgba(30,43,30,0.55);
    padding:0px 6px;
    border-radius:5px;
    line-height:1.5;
  }
  .pos-select{
    width:82px;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    text-align:center;
    padding:6px 4px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:var(--chalk);
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    text-overflow:ellipsis;
    box-shadow:0 1px 3px rgba(30,43,30,0.25);
  }
  .pos-select.empty{
    color:var(--ink-soft);
    font-weight:500;
    font-style:italic;
    border-color:var(--line);
    background:rgba(251,248,241,0.85);
  }
  .pos-select:focus{outline:2px solid var(--coral);outline-offset:1px;}
  .panel-title{
    font-family:'Teko',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:0.3px;
    margin:22px 0 8px;
    color:var(--ink);
  }
  .group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .bench{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    background:var(--chalk);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px;
    font-size:13.5px;
    font-weight:500;
  }
  .bench-empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;}
  .tally-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .tally-table{width:100%;border-collapse:collapse;}
  .tally-table th{
    font-family:'Teko',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--ink-soft);
    text-align:center;
    padding:0 0 6px;
    border-bottom:1.5px solid var(--ink);
  }
  .tally-table th:first-child{text-align:left;}
  .tally-table td{
    padding:8px 0;
    border-bottom:1px solid var(--line);
    text-align:center;
    font-size:13.5px;
  }
  .tally-table tr:last-child td{border-bottom:none;}
  .tally-table td.tally-name{
    text-align:left;
    font-weight:500;
    color:var(--ink);
  }
  .tally-count{
    font-family:'Teko',sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--chalk);
    border:1px solid var(--line);
    border-radius:999px;
    min-width:30px;
    display:inline-block;
    padding:1px 0;
  }
  .tally-count.high{color:var(--coral-dark);border-color:var(--coral);background:rgba(228,87,61,0.08);}
  .tally-count.zero{color:var(--ink-soft);opacity:0.5;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,43,30,0.45);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:14px;padding:20px;max-width:320px;width:100%;}
  .modal p{font-size:14.5px;margin:0 0 16px;color:var(--ink);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}
  @media (min-width: 480px){
    .pos-select{width:98px;font-size:12.5px;padding:7px 5px;}
    .pos-label{font-size:14px;}
  }
  .print-all{display:none;}
  @media print{
    .live-view{display:none !important;}
    .print-all{display:block !important;}
    body{padding:0;background:#fff;}
    .print-sheet{padding:28px 24px;page-break-after:always;}
    .print-sheet:last-child{page-break-after:auto;}
    .print-eyebrow{font-size:12px;color:var(--ink-soft);margin:0 0 2px;}
    .print-header h2{font-family:'Teko',sans-serif;font-weight:600;font-size:34px;margin:0 0 14px;color:var(--ink);}
    .print-field-wrap{position:relative;width:100%;aspect-ratio:700/660;}
    .print-field-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
    .print-pos{position:absolute;transform:translate(-50%,-50%);text-align:center;}
    .print-pos-label{display:block;font-family:'Teko',sans-serif;font-size:13px;font-weight:600;color:var(--ink);}
    .print-pos-name{display:inline-block;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;background:var(--chalk);border:1.2px solid var(--ink);border-radius:6px;padding:2px 6px;margin-top:1px;}
    .print-pos-name.print-empty{font-style:italic;font-weight:500;color:var(--ink-soft);border-color:var(--line);}
    .print-bench-wrap{margin-top:16px;font-size:13px;color:var(--ink);}
    .print-bench-label{font-weight:700;margin-right:6px;}
    .print-table{width:100%;border-collapse:collapse;table-layout:fixed;}
    .print-table th, .print-table td{border:1px solid var(--ink);padding:7px 4px;text-align:center;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink);}
    .print-table thead th{background:var(--ink);color:var(--chalk);font-family:'Teko',sans-serif;font-weight:600;font-size:15px;letter-spacing:0.3px;padding:8px 4px;}
    .print-table td.inning-cell{font-family:'Teko',sans-serif;font-weight:600;font-size:16px;background:var(--chalk);}
    .print-table td.empty-cell{color:var(--ink-soft);font-style:italic;}
    .print-table td.bench-cell{text-align:left;font-size:10px;padding:7px 6px;}
  }
</style>
</head>
<body>
<div class="wrap">
<div class="live-view">

  <header>
    <p class="eyebrow">9U · Kid Pitch</p>
    <h1>Party Animals</h1>
    <p class="subtitle">Lineup card — tap an inning, then tap a position to set it</p>
  </header>

  <div class="innings" id="inningTabs"></div>

  <div class="toolbar">
    <button class="btn" id="copyPrevBtn">Copy previous inning</button>
    <button class="btn danger" id="clearInningBtn">Clear this inning</button>
    <button class="btn" id="clearAllBtn">Clear all innings</button>
    <button class="btn primary" id="printBtn">Print all 6 innings</button>
    <button class="btn primary" id="printTableBtn">Print table view</button>
  </div>

  <div class="field-card">
    <div class="field-wrap" id="fieldWrap">

        <rect x="189" y="420" width="22" height="22" fill="var(--chalk)" stroke="var(--dirt-dark)" stroke-width="1.5" transform="rotate(45 200 431)"/>
        <path d="M333 568 L367 568 L367 587 L350 601 L333 587 Z" fill="var(--chalk)" stroke="var(--dirt-dark)" stroke-width="1.5"/>
        <line x1="350" y1="570" x2="500" y2="430" stroke="var(--chalk)" stroke-width="2.5" opacity="0.85"/>
        <line x1="350" y1="570" x2="200" y2="430" stroke="var(--chalk)" stroke-width="2.5" opacity="0.85"/>
      </svg>

      <div class="field-pos" id="fp-C" style="left:50%;top:96%;">
        <span class="pos-label">C</span>
        <select class="pos-select" id="select-C"><option value="">Empty</option><option value="Miles Walsh">Miles W.</option><option value="Clark Desmarais">Clark D.</option><option value="Kingston Bradley">Kingston B.</option><option value="Knox Griffin">Knox G.</option><option value="Cage Tackett">Cage T.</option><option value="Brayden Campbell">Brayden C.</option><option value="Theodore Elliott">Theodore E.</option><option value="Braden Bobo">Braden B.</option><option value="Hayes Foster">Hayes F.</option><option value="Tyson Burroughs">Tyson B.</option><option value="Reid Barnhart">Reid B.</option><option value="Talan Bliss">Talan B.</option><option value="Mack Kilpatrick">Mack K.</option><option value="James Jaremko">James J.</option></select>
      </div>
      <div class="field-pos" id="fp-P" style="left:50%;top:65.2%;">
        <span class="pos-label">P</span>
        <select class="pos-select" id="select-P"><option value="">Empty</option><option value="Miles Walsh">Miles W.</option><option value="Clark Desmarais">Clark D.</option><option value="Kingston Bradley">Kingston B.</option><option value="Knox Griffin">Knox G.</option><option value="Cage Tackett">Cage T.</option><option value="Brayden Campbell">Brayden C.</option><option value="Theodore Elliott">Theodore E.</option><option value="Braden Bobo">Braden B.</option><option value="Hayes Foster">Hayes F.</option><option value="Tyson Burroughs">Tyson B.</option><option value="Reid Barnhart">Reid B.</option><option value="Talan Bliss">Talan B.</option><option value="Mack Kilpatrick">Mack K.</option><option value="James Jaremko">James J.</option></select>
      </div>
      <div class="field-pos" id="fp-1B" style="left:75.7%;top:65.2%;">
        <span class="pos-label">1B</span>
        <select class="pos-select" id="select-1B"><option value="">Empty</option><option value="Miles Walsh">Miles W.</option><option value="Clark Desmarais">Clark D.</option>
